<style>
/* Layout: one centered column — dragon and forged logo on top, a stack of metal link plates, embers rising behind.
   Single dark look on purpose (same black, red and chrome as the stream overlays). */
:root{
  --bg:#050304; --plate:#120809; --plate-hi:#1d0c0e; --edge:#3a1416;
  --fg:#f1ecec; --mut:#b49a9b; --red:#ff2a2a; --ember:#ff7a3c;
  --display:"Cinzel","Trajan Pro","Times New Roman",serif; --body:"Rajdhani","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:500 17px/1.4 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 44px;
  background-image:radial-gradient(ellipse 70% 40% at 50% 16%,rgba(170,0,10,.55),transparent 70%),
    radial-gradient(ellipse 120% 60% at 50% 110%,rgba(120,0,6,.35),transparent 70%);
  overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:20px}

.hero{position:relative;width:100%;display:grid;place-items:center;padding-top:6px}
.dragon{width:min(62%,280px);filter:drop-shadow(0 0 22px rgba(255,20,30,.75)) drop-shadow(0 14px 18px rgba(0,0,0,.9));
  animation:breathe 4.5s ease-in-out infinite;transform-origin:50% 90%}
.logo{position:relative;width:min(100%,470px);margin-top:-46px;filter:drop-shadow(0 0 14px rgba(255,20,20,.8)) drop-shadow(0 6px 10px rgba(0,0,0,.9))}
.lava{position:absolute;top:0;width:3px;border-radius:2px;background:linear-gradient(#ff5a4a,#c0000c 80%,transparent);box-shadow:0 0 8px var(--red);
  height:0;animation:pour 2.2s ease-out .6s forwards}
@keyframes pour{to{height:38px}}
@keyframes breathe{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(-1.2deg) scale(1.02)}}

.tag{font:700 13px var(--body);letter-spacing:.3em;color:var(--mut);text-transform:uppercase;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px}
.tag i{color:var(--red);font-style:normal}
.who{font:700 12px var(--body);letter-spacing:.32em;text-transform:uppercase;color:#ffd6d0;padding:7px 16px;
  border:1px solid var(--edge);background:linear-gradient(90deg,rgba(80,0,6,.6),rgba(20,4,5,.6));
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);text-shadow:0 0 10px rgba(255,30,30,.7)}

nav{width:100%;display:flex;flex-direction:column;gap:12px}
a.l{--c:var(--red);position:relative;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px;padding:14px 18px;text-decoration:none;color:var(--fg);
  background:linear-gradient(100deg,var(--plate-hi),var(--plate) 60%,#0a0506);border:1px solid var(--edge);
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:transform .18s,border-color .18s,background .18s}
a.l::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,40,40,.0) 40%,rgba(255,60,50,.18) 50%,transparent 60%);background-size:250% 100%;background-position:120% 0;transition:background-position .6s}
a.l::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);box-shadow:0 0 14px var(--red)}
a.l:hover,a.l:focus-visible{transform:translateX(4px);border-color:var(--red);outline:none;background:linear-gradient(100deg,#2a0d10,#160809 60%,#0c0506)}
a.l:hover::before,a.l:focus-visible::before{background-position:-20% 0}
a.l:focus-visible{box-shadow:0 0 0 2px var(--red)}
.ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;justify-self:center;
  background:radial-gradient(circle at 35% 30%,#3a0a0c,#0d0304 70%);box-shadow:0 0 0 2px #2a2a2a,0 0 0 3px var(--red),0 0 14px rgba(255,20,20,.6)}
.ico svg{width:24px;height:24px;fill:var(--c);filter:drop-shadow(0 0 6px var(--c))}
.n{display:flex;flex-direction:column;min-width:0}
.n b{font:900 18px var(--display);letter-spacing:.12em;
  background:linear-gradient(180deg,#fff 0%,#e2e2e2 40%,#7b7b7b 52%,#d9d9d9 75%,#9a9a9a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.n span{color:var(--mut);font-weight:600;font-size:15px;overflow-wrap:anywhere}
.go{font:700 12px var(--body);letter-spacing:.2em;color:var(--red);text-shadow:0 0 8px rgba(255,30,30,.6)}
footer{color:var(--mut);font-size:13px;letter-spacing:.14em;text-align:center}
@media (prefers-reduced-motion:reduce){a.l,a.l::before{transition:none}.dragon,.lava{animation:none}.lava{height:38px}#fx{display:none}}
</style>

<script>
/* Brasas rojas que suben, como en las escenas del stream */
(()=>{const cv=document.getElementById('fx'),g=cv.getContext('2d');if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
let W,H,D;function rs(){D=devicePixelRatio||1;W=cv.width=innerWidth*D;H=cv.height=innerHeight*D}rs();addEventListener('resize',rs);
const P=[];const add=(init)=>P.push({x:Math.random()*W,y:init?Math.random()*H:H+20*D,vx:(Math.random()-.5)*12*D,vy:-(18+Math.random()*40)*D,s:(.8+Math.random()*1.8)*D,a:0,life:5+Math.random()*7,t:init?Math.random()*5:0});
for(let i=0;i<60;i++)add(true);let last=performance.now();
function loop(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;g.clearRect(0,0,W,H);g.globalCompositeOperation='lighter';
for(let i=P.length-1;i>=0;i--){const p=P[i];p.t+=dt;if(p.t>p.life||p.y<-20){P.splice(i,1);add(false);continue}
p.x+=(p.vx+Math.sin(now/900+i)*8*D)*dt;p.y+=p.vy*dt;const a=Math.sin(Math.PI*p.t/p.life),r=p.s*5;
const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,r);gr.addColorStop(0,`rgba(255,200,160,${a})`);gr.addColorStop(.35,`rgba(255,40,20,${a*.55})`);gr.addColorStop(1,'rgba(255,0,0,0)');g.fillStyle=gr;g.fillRect(p.x-r,p.y-r,r*2,r*2)}
requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script>
